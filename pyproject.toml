[project]
name = "claude-sql-demo"
version = "0.1.0"
description = "An MCP server that lets Claude answer questions from a sample business SQL database, safely."
readme = "README.md"
authors = [{ name = "Gary Bailey" }]
requires-python = ">=3.13"
dependencies = [
    "mcp>=1.20",
]

[project.scripts]
claude-sql-demo = "claude_sql_demo:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
